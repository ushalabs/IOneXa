<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="50%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0B0D13"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#4E9CFF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#262D3D"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bannerBg)" rx="16"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1F2430" stroke-width="1" opacity="0.4">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1120" y1="0" x2="1120" y2="360"/>
  </g>

  <!-- Glow highlights -->
  <circle cx="200" cy="180" r="160" fill="#38BDF8" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1080" cy="180" r="140" fill="#818CF8" opacity="0.08" filter="blur(60px)"/>

  <!-- Left: Stylized Icon Badge -->
  <g transform="translate(80, 70)">
    <rect width="220" height="220" rx="48" fill="url(#badgeGrad)" stroke="#343B48" stroke-width="3" filter="url(#cardShadow)"/>
    
    <!-- Phone frame preview -->
    <rect x="55" y="30" width="110" height="160" rx="18" fill="#12141A" stroke="#475569" stroke-width="2"/>
    <rect x="90" y="38" width="40" height="7" rx="3.5" fill="#000000"/>
    
    <!-- IX Monogram in frame -->
    <rect x="75" y="65" width="12" height="75" rx="6" fill="#38BDF8"/>
    <path d="M 100 65 L 138 140" stroke="#4E9CFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M 138 65 L 100 140" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Center-Right: Typography & Badges -->
  <g transform="translate(340, 75)">
    <!-- Publisher / Release Tag -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#1E2330" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="14" y="17" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">USHA LABS  •  v0.1.0</text>

    <!-- Main Title -->
    <text x="0" y="74" font-family="'Segoe UI Variable Display', 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="url(#accentGrad)" letter-spacing="-1">IOneXa</text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#F2F4F8">Windows-Native Mobile Developer Workbench</text>
    <text x="0" y="138" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">High-performance Expo &amp; React Native workbench with standalone device emulation</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1C212B" stroke="#343B48"/>
      <text x="16" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">📱 Standalone Window</text>

      <rect x="172" y="0" width="145" height="32" rx="8" fill="#1C212B" stroke="#343B48"/>
      <text x="188" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">⚡ Metro Fast Refresh</text>

      <rect x="329" y="0" width="150" height="32" rx="8" fill="#1C212B" stroke="#343B48"/>
      <text x="345" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">🌐 Edge WebView2</text>

      <rect x="491" y="0" width="155" height="32" rx="8" fill="#1C212B" stroke="#343B48"/>
      <text x="507" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">🔍 Network &amp; HAR 1.2</text>

      <rect x="658" y="0" width="175" height="32" rx="8" fill="#1C212B" stroke="#343B48"/>
      <text x="674" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">🛡️ Truth in Engineering</text>
    </g>
  </g>
</svg>
