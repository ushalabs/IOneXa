<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="50%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0B0D13"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#343B48" stroke-width="6" filter="url(#shadow)"/>

  <!-- Device Frame Silhouette -->
  <rect x="146" y="80" width="220" height="352" rx="36" fill="#16181D" stroke="#334155" stroke-width="4"/>
  
  <!-- Dynamic Island Notch -->
  <rect x="226" y="96" width="60" height="14" rx="7" fill="#000000" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Screen Content Area -->
  <rect x="158" y="122" width="196" height="270" rx="16" fill="#0B0F19"/>

  <!-- Stylized "IX" Core Monogram -->
  <!-- 'I' Column -->
  <rect x="190" y="170" width="26" height="174" rx="13" fill="url(#cyanAccent)" filter="url(#glow)"/>
  
  <!-- 'X' Crossing Strokes -->
  <path d="M 240 170 L 322 344" stroke="url(#primaryAccent)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 322 170 L 240 344" stroke="url(#cyanAccent)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Mobile Home Indicator -->
  <rect x="220" y="412" width="72" height="4" rx="2" fill="#64748B"/>
</svg>
